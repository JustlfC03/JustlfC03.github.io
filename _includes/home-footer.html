<footer class="home-footer" id="contact" aria-label="Contact and page footer">
  <div class="home-footer__inner">
    <div class="home-footer__main">
      <div class="home-footer__statement">
        <p class="home-footer__motto"><span>{{ site.author.bio | split: '<br>' | first | replace: ' in ', ' in</span> <span>' }}</span></p>
        <p class="home-footer__translation" lang="zh-CN">{{ site.author.bio | split: '<br>' | last }}</p>
      </div>
      <div class="home-footer__meta">
        <a class="profile-visitors home-footer__visitors" href="https://mapmyvisitors.com/web/1bx54" target="_blank" rel="noopener noreferrer" title="View historical visitor map (opens in a new tab) · Count: Busuanzi snapshot {{ site.data.visitor_stats.fetched_at }}" data-visitor-hostname="{{ site.data.visitor_stats.hostname }}" aria-live="polite" aria-atomic="true">
          <svg class="profile-visitors__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5.2a3 3 0 0 1 0 5.6M18 14a5 5 0 0 1 3 4.6V20"/></svg>
          <span class="profile-visitors__label">Visitors</span>
          <span class="profile-visitors__separator" aria-hidden="true">·</span>
          <span class="profile-visitors__count" id="busuanzi_value_site_uv">{{ site.data.visitor_stats.site_uv }}</span>
        </a>
      </div>
      <address class="home-footer__contact" aria-label="Contact information">
        <a class="home-footer__email" href="mailto:{{ site.author.email }}">{{ site.author.email }} <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" focusable="false"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
        <p class="home-footer__address" lang="zh-CN"><span>北京市海淀区双清路30号</span><wbr><span>清华大学生物医学影像研究中心</span></p>
      </address>
    </div>
  </div>
</footer>
