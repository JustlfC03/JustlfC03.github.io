<header class="home-header">
  <div class="home-header__inner">
    <a class="home-wordmark" href="#about-me">About Me</a>
    <nav class="home-nav" aria-label="Main navigation">
      <div class="home-nav__links"></div>
      <details class="home-nav__more">
        <summary class="home-nav__toggle" aria-label="More navigation" aria-controls="home-nav-overflow">
          <span>More</span>
          <svg class="home-nav__chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="home-nav__menu" id="home-nav-overflow">
          {% for link in site.data.navigation.main %}
            <a href="{{ link.url }}">{{ link.title }}</a>
          {% endfor %}
        </div>
      </details>
    </nav>
  </div>
</header>
