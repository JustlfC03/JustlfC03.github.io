name: Get Citation Data

on:
  schedule:
    # Monday, Wednesday and Friday at 09:00 Asia/Shanghai (UTC+8).
    - cron: '0 1 * * 1,3,5'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python main.py

      - name: Check out statistics branch
        uses: actions/checkout@v7
        with:
          ref: google-scholar-stats
          path: scholar-stats

      - name: Publish citation data
        working-directory: scholar-stats
        run: |
          cp ../google_scholar_crawler/results/gs_data.json .
          cp ../google_scholar_crawler/results/gs_data_shieldsio.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git commit -m "Update citation data"
          git push origin HEAD:google-scholar-stats
